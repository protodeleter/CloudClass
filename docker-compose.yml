# Run locally on Windows (Docker Desktop/Linux containers) or macOS.
# Avalonia remains a native desktop application, outside Docker.
services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-EN20261008
    container_name: avalonia-cosmos-emulator
    environment:
      PROTOCOL: https
      EXPLORER_PROTOCOL: http
      ENABLE_INIT_DATA: "true"
      INIT_PATH: /init
      CERT_PATH: /certs/localhost.pfx
      CERT_SECRET: ${COSMOS_CERT_PASSWORD:?Set COSMOS_CERT_PASSWORD in .env}
    ports:
      - "127.0.0.1:8081:8081"  # HTTPS API gateway (.NET SDK)
      - "127.0.0.1:1234:1234"  # HTTP Data Explorer
      - "127.0.0.1:8080:8080"  # HTTP readiness endpoint
    volumes:
      - ./docker/cosmos/init:/init:ro
      - ./docker/cosmos/certs/localhost.pfx:/certs/localhost.pfx:ro
      - cosmos-data:/data
    restart: unless-stopped

volumes:
  cosmos-data:

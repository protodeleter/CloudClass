
services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-EN20261008
    container_name: avalonia-cosmos-emulator

    environment:
      PROTOCOL: https
      EXPLORER_PROTOCOL: http
      ENABLE_INIT_DATA: "true"
      INIT_PATH: /init

    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:1234:1234"
      - "127.0.0.1:8080:8080"

    volumes:
      - ./docker/cosmos/init:/init:ro
      - cosmos-data:/data

    restart: unless-stopped

volumes:
  cosmos-data:
